[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sikumon"
version = "0.1.0"
description = "Hebrew-first local meeting assistant for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.10,<3",
    "keyring>=25,<26",
]

[project.optional-dependencies]
analysis = ["openai>=1.68,<2", "httpx>=0.27,<1"]
transcription = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.1",
    "huggingface-hub==1.29.0",
]
packaging = ["pyinstaller>=6.12,<7"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.gui-scripts]
sikumon = "sikumon.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sikumon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src/sikumon"]
strict = true
